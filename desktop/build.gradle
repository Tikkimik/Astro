sourceCompatibility = 21
targetCompatibility = 21
sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "com.mygdx.game.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

import org.gradle.internal.os.OperatingSystem

task run(dependsOn: classes, type: JavaExec) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    if (project.hasProperty("visualTest")) {
        systemProperty "astro.visualTest", project.property("visualTest")
        def visualOutput = project.findProperty("visualOutput") ?:
                new File(rootProject.buildDir, "visual-tests/${project.property('visualTest')}.png").absolutePath
        systemProperty "astro.visualOutput", visualOutput
        systemProperty "astro.visualCaptureTime", project.findProperty("visualCaptureTime") ?: "3.0"
    }

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        // Required to run on macOS
        jvmArgs += "-XstartOnFirstThread"
    }
}

task debug(dependsOn: classes, type: JavaExec) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

task dist(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}


dist.dependsOn classes

task javaPackager(type: Exec, dependsOn: dist) {
    workingDir project.projectDir
    commandLine = [
            'javapackager',
            '-deploy',
            '-no sign',
            '-outdir', "${buildDir}/distribution",
            '-srcdir', "${buildDir}/libs",
            '-native', 'image',
            '-name', project.appName,
            '-appClass', project.mainClassName
    ]
}

eclipse.project.name = appName + "-desktop"
